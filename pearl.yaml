# Pearl Configuration - Claude OAuth
server:
  port: 8787
  host: 0.0.0.0
  cors: true

memory:
  store: sqlite
  path: ~/.pearl/memories.db

extraction:
  enabled: true
  model: ollama/llama3.2:1b
  async: true
  extract_from_assistant: false
  min_confidence: 0.7

embedding:
  provider: ollama
  model: nomic-embed-text
  dimensions: 768
  base_url: http://localhost:11434

retrieval:
  max_memories: 10
  min_similarity: 0.5
  token_budget: 500
  recency_boost: true

routing:
  classifier: ollama/llama3.2:1b
  default_model: anthropic-max/claude-sonnet-4-20250514
  rules:
    # High complexity or analysis → Opus
    - name: high-complexity
      match:
        complexity: high
      model: anthropic-max/claude-opus-4-5
      priority: 50
    - name: analysis-tasks
      match:
        type: analysis
      model: anthropic-max/claude-opus-4-5
      priority: 40
    # Code and creative → Sonnet
    - name: code-tasks
      match:
        type: code
      model: anthropic-max/claude-sonnet-4-20250514
      priority: 30
    - name: creative-writing
      match:
        type: creative
      model: anthropic-max/claude-sonnet-4-20250514
      priority: 25
    # Simple/short → Haiku 4
    - name: simple-fast
      match:
        complexity: low
        estimatedTokens: "<500"
      model: anthropic-max/claude-3-haiku-20240307
      priority: 20
    - name: chat-greetings
      match:
        type: chat
      model: anthropic-max/claude-3-haiku-20240307
      priority: 15

backends:
  anthropic:
    # Account 2 OAuth token (dedicated to Pearl, separate from OpenClaw's account 1)
    api_key: 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
    credentials_file: ~/.claude/credentials-account2.json
  ollama:
    base_url: http://localhost:11434

logging:
  level: info
